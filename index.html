<!DOCTYPE html>
<html>
  <head>
    <title>VR Homework - Week 12</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <a-asset-item id="leftModel" src="cinnamoroll.glb"></a-asset-item>
        <a-asset-item id="rightModel" src="sunna_zzz.glb"></a-asset-item>
      </a-assets>

      <a-sky color="#FFF0F5"></a-sky>
      <a-plane position="0 0 0" rotation="-90 0 0" width="30" height="30" color="#FFB6C1"></a-plane>

      <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
      <a-light type="directional" position="1 4 2" intensity="0.6"></a-light>

      <a-gltf-model 
        src="#leftModel" 
        position="-2 0.2 -5" 
        scale="0.1 0.1 0.1">
      </a-gltf-model>

      <a-gltf-model 
        src="#rightModel" 
        position="2 0.2 -5" 
        scale="0.1 0.1 0.1">
      </a-gltf-model>

      <a-entity position="0 1.6 0" camera look-controls></a-entity>
    </a-scene>
  </body>
</html>
